<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUTCOME</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1b1a17; --muted: #6b6862;
    --line: #e3e0d9; --accent: #1f6f5c; --warn: #a8641b; --bad: #a3372b;
    --good: #1f6f5c; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f; --panel: #1c1d17; --ink: #eceadf; --muted: #9a978c;
      --line: #2e2f27; --accent: #6fc0a5; --warn: #d99a4e; --bad: #e0796a;
      --good: #6fc0a5; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 96px; }

  header { margin-bottom: 28px; }
  h1 { font-size: 26px; letter-spacing: .14em; margin: 0 0 4px; font-weight: 650; }
  .tag { color: var(--muted); font-size: 15px; margin: 0; }
  .mode {
    display: inline-block; margin-top: 12px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .mode.live { color: var(--bad); border-color: var(--bad); font-weight: 600; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px;
  }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend, label {
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); padding: 0; margin-bottom: 7px; display: block;
  }
  textarea, select, input {
    width: 100%; font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; resize: vertical;
    min-width: 0;
  }
  input[type="number"] { font-family: var(--mono); }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 13px; margin: 7px 0 0; }

  button {
    font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; white-space: nowrap;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  button.link {
    background: transparent; border: 0; color: var(--accent); padding: 4px 0;
    font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px;
  }
  button.del {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: 0; width: 34px; height: 36px; font-weight: 400; line-height: 1;
  }
  button.del:hover { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }

  .grid { display: grid; gap: 8px; margin-bottom: 8px; align-items: center; }
  .grid.constraint { grid-template-columns: 8.5rem 1fr 7.5rem 6.5rem 34px; }
  .grid.org { grid-template-columns: 1fr 11rem 1fr 34px; }
  .grid.budget { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 640px) {
    .grid.constraint, .grid.org { grid-template-columns: 1fr 1fr; }
    .grid.constraint > :nth-child(2), .grid.org > :nth-child(1) { grid-column: 1 / -1; }
  }
  .foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .foot > .grow { flex: 1 1 200px; }

  .error {
    border: 1px solid var(--bad); color: var(--bad); border-radius: 8px;
    padding: 10px 12px; margin-top: 14px; font-size: 14px;
  }
  .error:empty { display: none; }

  /* timeline */
  #timeline { position: relative; padding-left: 26px; }
  #timeline:empty { display: none; }
  #timeline::before {
    content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px;
    width: 1px; background: var(--line);
  }
  .step { position: relative; margin-bottom: 22px; animation: rise .32s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  .dot {
    position: absolute; left: -26px; top: 4px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--line);
  }
  .step.call .dot { border-color: var(--accent); }
  .step.good .dot { border-color: var(--good); background: var(--good); }
  .step.bad .dot { border-color: var(--bad); }
  .step.warn .dot { border-color: var(--warn); background: var(--warn); }

  .step h3 { margin: 0 0 3px; font-size: 15px; font-weight: 600; }
  .step .sub { color: var(--muted); font-size: 13.5px; }
  .step .phone { font-family: var(--mono); font-size: 12.5px; }
  ul.facts { margin: 8px 0 0; padding-left: 17px; color: var(--muted); font-size: 14px; }
  ul.facts li { margin-bottom: 2px; }
  ul.facts li.blocker { color: var(--bad); }

  .offer { margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
  .offer .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .offer .price { font-family: var(--mono); font-weight: 600; }
  .verdict { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
  .verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
  .checks { margin: 9px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .checks li { display: flex; gap: 8px; }
  .checks .m { width: 1em; font-weight: 700; }
  .checks .ok .m { color: var(--good); } .checks .no .m { color: var(--bad); }
  .checks .soft .m { color: var(--warn); } .checks .unk .m { color: var(--muted); }

  .lead { color: var(--warn); font-size: 13.5px; margin-top: 7px; }

  .approval { border-color: var(--warn); border-width: 2px; }
  .approval h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .09em;
                 text-transform: uppercase; color: var(--warn); }
  .approval p.q { font-size: 17px; margin: 0 0 12px; }
  .rejected { margin-top: 12px; font-size: 13.5px; color: var(--muted); }

  .result { border-width: 2px; }
  .result.ok { border-color: var(--good); } .result.no { border-color: var(--bad); }
  .result h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; }
  .result.ok h2 { color: var(--good); } .result.no h2 { color: var(--bad); }
  .result .headline { font-size: 19px; margin: 0 0 10px; }
  .ref { font-family: var(--mono); font-weight: 600; }
  .meta { color: var(--muted); font-size: 13.5px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OUTCOME</h1>
    <p class="tag">Don't tell it who to call. Tell it what needs to happen.</p>
    <span class="mode" id="mode">checking&hellip;</span>
  </header>

  <section class="card" id="form">
    <fieldset>
      <label for="goal">What needs to happen?</label>
      <textarea id="goal" rows="3"></textarea>
      <button class="link" id="parse" type="button">Read the requirements out of this</button>
    </fieldset>

    <fieldset>
      <legend>Requirements &mdash; what an acceptable answer has to satisfy</legend>
      <div id="constraints"></div>
      <button class="link" id="add-constraint" type="button">+ add a requirement</button>
      <p class="hint">
        <b>Must</b> disqualifies an answer that breaks it. <b>Prefer</b> only ranks it lower.
        Amounts are plain numbers; dates are YYYY-MM-DD.
      </p>
    </fieldset>

    <fieldset>
      <legend>Who to call first</legend>
      <div id="orgs"></div>
      <button class="link" id="add-org" type="button">+ add an organisation</button>
      <p class="hint" id="phonebook-hint"></p>
    </fieldset>

    <fieldset>
      <legend>Call budget</legend>
      <div class="grid budget">
        <div>
          <label for="max-calls">Calls in total</label>
          <input id="max-calls" type="number" min="1" max="25" value="6">
        </div>
        <div>
          <label for="max-per-org">Calls per organisation</label>
          <input id="max-per-org" type="number" min="1" max="5" value="2">
        </div>
      </div>
    </fieldset>

    <div class="foot">
      <div class="grow">
        <label for="scenario">Scenario</label>
        <select id="scenario"></select>
      </div>
      <button id="start" type="button">Start</button>
      <button id="reset" class="ghost" type="button">Reset</button>
    </div>
    <div class="error" id="error"></div>
  </section>

  <div id="timeline"></div>
  <div id="approval"></div>
  <div id="result"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
// How long each row rests on screen before the next arrives. 900ms feels right
// when you are driving it; it is far too fast to narrate over, because the whole
// run lands in about fifteen seconds. `?pace=5000` slows it to roughly the speed
// somebody can talk through, which is what recording a demo needs — and being a
// query parameter, it can be adjusted between takes without touching the code.
const STEP_DELAY = (() => {
  const asked = Number(new URLSearchParams(location.search).get("pace"));
  return Number.isFinite(asked) && asked > 0 ? Math.min(Math.max(asked, 100), 15000) : 900;
})();
const KINDS = ["budget", "minimum", "deadline", "required_fact", "preference", "forbidden"];
let runId = null;
let scenarios = [];
let live = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (o) => o.price == null ? "no price quoted" : `${o.currency} ${o.price.toFixed(2)}`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- the form ---------- */

function el(tag, cls, attrs = {}) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

function constraintRow(c = {}) {
  const row = el("div", "grid constraint");
  const kind = el("select", null, { "aria-label": "requirement type" });
  kind.innerHTML = KINDS.map((k) =>
    `<option value="${k}"${k === (c.kind || "budget") ? " selected" : ""}>${k.replace("_", " ")}</option>`
  ).join("");
  const desc = el("input", null, { placeholder: "what it means, in your words", "aria-label": "description" });
  desc.value = c.description || "";
  const value = el("input", null, { placeholder: "500 / 2026-09-11", "aria-label": "value" });
  value.value = c.value == null ? "" : String(c.value);
  const hard = el("select", null, { "aria-label": "hard or soft" });
  hard.innerHTML = `<option value="1"${c.hard === false ? "" : " selected"}>must</option>` +
                   `<option value="0"${c.hard === false ? " selected" : ""}>prefer</option>`;
  const del = el("button", "del", { type: "button", "aria-label": "remove requirement" });
  del.textContent = "×";
  del.onclick = () => row.remove();
  row.append(kind, desc, value, hard, del);
  return row;
}

function orgRow(o = {}) {
  const row = el("div", "grid org");
  const name = el("input", null, { placeholder: "organisation", "aria-label": "name" });
  name.value = o.name || "";
  const phone = el("input", null, { placeholder: "+15550100001", "aria-label": "phone", inputmode: "tel" });
  phone.value = o.phone || "";
  const role = el("input", null, { placeholder: "why them (optional)", "aria-label": "role" });
  role.value = o.role || "";
  const del = el("button", "del", { type: "button", "aria-label": "remove organisation" });
  del.textContent = "×";
  del.onclick = () => row.remove();
  row.append(name, phone, role, del);
  return row;
}

function fillForm(def) {
  $("goal").value = def.goal || "";
  $("constraints").replaceChildren(...(def.constraints || []).map(constraintRow));
  $("orgs").replaceChildren(...(def.organizations || []).map(orgRow));
  if (!$("orgs").children.length) $("orgs").append(orgRow());
  $("max-calls").value = (def.budget || {}).max_calls ?? 6;
  $("max-per-org").value = (def.budget || {}).max_calls_per_org ?? 2;
  $("error").textContent = "";
}

function collect() {
  const constraints = [...$("constraints").children].map((row) => {
    const [kind, desc, value, hard] = row.children;
    return {
      kind: kind.value,
      description: desc.value.trim(),
      value: value.value.trim(),
      hard: hard.value === "1",
    };
  }).filter((c) => c.description || c.value);
  const organizations = [...$("orgs").children].map((row) => {
    const [name, phone, role] = row.children;
    return { name: name.value.trim(), phone: phone.value.trim(), role: role.value.trim() };
  }).filter((o) => o.name || o.phone);
  return {
    goal: $("goal").value.trim(),
    constraints,
    organizations,
    budget: {
      max_calls: Number($("max-calls").value),
      max_calls_per_org: Number($("max-per-org").value),
    },
  };
}

async function parseGoal() {
  const text = $("goal").value.trim();
  if (!text) return;
  $("parse").disabled = true;
  try {
    const res = await fetch("/api/interpret", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok) { $("error").textContent = data.error; return; }
    $("goal").value = data.goal;
    // Replace rather than merge: the parse is a fresh reading of the sentence,
    // and silently keeping a stale requirement beside it is how a user ends up
    // running against limits they think they removed.
    $("constraints").replaceChildren(...data.constraints.map(constraintRow));
    $("error").textContent = data.constraints.length
      ? "" : "Nothing in that sentence reads as a requirement. Add them by hand below.";
  } finally {
    $("parse").disabled = false;
  }
}

/* ---------- the timeline ---------- */

const markClass = (r) => r.judgement === "satisfied" ? "ok"
  : r.judgement === "violated" ? (r.hard ? "no" : "soft") : "unk";
const markGlyph = (r) => r.judgement === "satisfied" ? "✓"
  : r.judgement === "violated" ? (r.hard ? "✗" : "~") : "?";
const checks = (results) => `<ul class="checks">${results.map((r) =>
  `<li class="${markClass(r)}"><span class="m">${markGlyph(r)}</span><span>${esc(r.detail)}</span></li>`
).join("")}</ul>`;

function step(cls, html) {
  const node = el("div", `step ${cls}`);
  node.innerHTML = `<span class="dot"></span>${html}`;
  $("timeline").appendChild(node);
  node.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return node;
}

function renderEvent(e) {
  switch (e.kind) {
    // "planned" is not rendered: the very next event is "calling", carrying the
    // same purpose, and showing both makes every call appear twice.
    case "planned":
      return;
    case "calling":
      return step("call", `<h3>☎ ${esc(e.purpose)}</h3>
        <div class="sub"><span class="phone">${esc(e.phone)}</span>${
          e.attempt > 1 ? ` · attempt ${e.attempt}` : ""
        }${e.commits_user ? ' · <b>commits you</b>' : ""}</div>`);
    case "lead_discovered":
      return step("warn", `<h3>New lead: ${esc(e.org)}</h3>
        <div class="sub"><span class="phone">${esc(e.phone)}</span></div>
        <div class="lead">${esc(e.reason)}</div>`);
    case "evidence": {
      const good = e.verdict === "confirmed";
      const bad = ["blocked", "refused", "no_answer"].includes(e.verdict);
      let html = `<h3>${esc(e.org || "")} — ${esc(e.verdict.replace("_", " "))}</h3>`;
      const items = (e.facts || []).map((f) => `<li>${esc(f)}</li>`)
        .concat((e.blockers || []).map((b) => `<li class="blocker">${esc(b)}</li>`));
      if (items.length) html += `<ul class="facts">${items.join("")}</ul>`;
      if (e.offer) {
        html += `<div class="offer"><div class="head">
            <span>${esc(e.offer.summary)}${e.offer.eta ? ` · ${esc(e.offer.eta)}` : ""}</span>
            <span class="price">${esc(money(e.offer))}</span></div>
          <div class="verdict ${e.acceptable ? "ok" : "no"}">${
            e.acceptable ? "meets your requirements" : "rejected"
          }</div>${checks(e.constraint_report || [])}</div>`;
      }
      return step(good ? "good" : bad ? "bad" : "", html);
    }
    case "approved":  return step("good", `<h3>You approved it</h3>`);
    case "rejected":  return step("bad", `<h3>You declined — back out to look again</h3>
                                          <div class="sub">${esc(e.reason)}</div>`);
    case "awaiting_user": return step("warn", `<h3>Waiting on you</h3>
                                          <div class="sub">${esc(e.purpose)}</div>`);
    case "awaiting_window":
      return step("warn", `<h3>Paused — outside the calling window</h3>
        <div class="sub">${esc(e.detail)}</div>
        <div class="lead">The run is not lost. It resumes at this call when the
          window opens.</div>`);
    case "unresolved_call":
      return step("bad", `<h3>A call was started and never accounted for</h3>
        <div class="sub"><span class="phone">${esc(e.phone)}</span></div>
        <div class="lead">${esc(e.detail)}</div>`);
    case "replayed":
      return step("", `<h3>Already placed — replaying the stored result</h3>
        <div class="sub">${esc(e.detail)}</div>`);
    case "error":     return step("bad", `<h3>Error</h3><div class="sub">${esc(e.detail)}</div>`);
    default: return;
  }
}

function renderApproval(e) {
  const rejected = (e.rejected || []).map((r) =>
    `<div>Turned down: ${esc(r.offer.summary)} — ${esc(money(r.offer))}</div>`).join("");
  $("approval").innerHTML = `<div class="card approval">
      <h2>Approval needed</h2>
      <p class="q">${esc(e.prompt)}</p>
      ${e.evaluation ? checks(e.evaluation.results) : ""}
      ${rejected ? `<div class="rejected">${rejected}</div>` : ""}
      <div class="foot">
        <button id="yes" type="button">Approve</button>
        <button id="no" class="ghost" type="button">Decline</button>
      </div>
    </div>`;
  $("yes").onclick = () => decide(true);
  $("no").onclick = () => decide(false);
  $("approval").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderResult(e, ok) {
  $("approval").innerHTML = "";
  const parties = (e.parties || []).map((p) =>
    `<div>${esc(p.name)} · <span class="phone">${esc(p.phone)}</span> · ${p.calls} call${
      p.calls === 1 ? "" : "s"} · ${esc(p.verdict.replace("_", " "))}${
      p.discovered ? " · found by the agent" : ""}</div>`).join("");
  $("result").innerHTML = `<div class="card result ${ok ? "ok" : "no"}">
      <h2>${ok ? "Resolved" : "Not resolved"}</h2>
      <p class="headline">${esc(e.headline)}</p>
      ${e.reference ? `<div>Reference <span class="ref">${esc(e.reference)}</span></div>` : ""}
      ${e.why ? `<div class="sub">${esc(e.why)}</div>` : ""}
      ${(e.constraint_report || []).length ? checks(e.constraint_report) : ""}
      <div class="meta">${e.calls_placed} of ${e.call_budget} calls used.</div>
      <div class="meta">${parties}</div>
    </div>`;
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function play(events) {
  for (const e of events) {
    if (e.kind === "started") continue;
    if (e.kind === "approval_required") { await sleep(STEP_DELAY); renderApproval(e); return; }
    if (e.kind === "resolved")  { await sleep(STEP_DELAY); renderResult(e, true);  return; }
    if (e.kind === "abandoned") { await sleep(STEP_DELAY); renderResult(e, false); return; }
    if (renderEvent(e)) await sleep(STEP_DELAY);
  }
}

/* ---------- running ---------- */

async function start() {
  $("error").textContent = "";
  const outcome = collect();
  if (!outcome.goal) { $("error").textContent = "Say what needs to happen."; return; }
  $("start").disabled = true;
  $("timeline").innerHTML = ""; $("approval").innerHTML = ""; $("result").innerHTML = "";
  try {
    const res = await fetch("/api/runs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scenario: $("scenario").value, outcome }),
    });
    const data = await res.json();
    if (!res.ok) { $("error").textContent = data.error; return; }
    runId = data.outcome.id;
    await play(data.events);
  } finally {
    $("start").disabled = false;
  }
}

async function decide(approve) {
  $("approval").innerHTML = "";
  const res = await fetch("/api/decide", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ run_id: runId, approve }),
  });
  const data = await res.json();
  if (!res.ok) { step("bad", `<h3>${esc(data.error)}</h3>`); return; }
  await play(data.events);
}

/* ---------- boot ---------- */

function currentScenario() {
  return scenarios.find((s) => s.name === $("scenario").value);
}

async function boot() {
  live = (await (await fetch("/api/mode")).json()).live;
  $("mode").textContent = live ? "live · real calls" : "mock · no calls placed";
  $("mode").className = live ? "mode live" : "mode";
  $("phonebook-hint").textContent = live
    ? "These numbers will be dialled. E.164 only, e.g. +15550100001."
    : "Mock mode replays the selected scenario's script. A number the scenario "
      + "does not cover comes back as no answer — which is a real path worth watching.";

  scenarios = (await (await fetch("/api/scenarios")).json()).scenarios;
  $("scenario").innerHTML = scenarios.map((s) =>
    `<option value="${esc(s.name)}">${esc(s.title)}</option>`).join("");
  if (scenarios[0]) fillForm(scenarios[0].outcome);

  $("scenario").onchange = () => fillForm(currentScenario().outcome);
  $("reset").onclick = () => fillForm(currentScenario().outcome);
  $("add-constraint").onclick = () => $("constraints").append(constraintRow());
  $("add-org").onclick = () => $("orgs").append(orgRow());
  $("parse").onclick = parseGoal;
  $("start").onclick = start;
}
boot();
</script>
</body>
</html>
